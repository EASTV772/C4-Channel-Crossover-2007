<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>C4 Channel Crossover Menu 2007 - Mobile Editor</title>


<style>

/* =========================
   C4 HEADLINE FONT
========================= */

@font-face {

    font-family: "C4Headline";

    src:
        url("C4Headline.ttf")
        format("truetype");

    font-weight: normal;

    font-style: normal;

}


/* =========================
   GENERAL
========================= */

html,
body {

    margin: 0;

    padding: 0;

    background: #000;

    color: white;

    font-family: Arial, sans-serif;

    width: 100%;

    min-height: 100vh;

}


/* =========================
   DESKTOP LAYOUT
========================= */

body {

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}


/* =========================
   EDITOR
========================= */

.editor {

    position: fixed;

    top: 20px;

    left: 20px;

    width: 300px;

    background:
        rgba(0, 0, 0, 0.88);

    padding: 18px;

    border-radius: 8px;

    border: 1px solid #444;

    color: white;

    z-index: 100;

    max-height:
        calc(100vh - 40px);

    overflow-y: auto;

}


.editor h2 {

    margin:
        0 0 15px 0;

    font-size: 18px;

}


/* =========================
   LABELS
========================= */

.editor label {

    display: block;

    color: #aaa;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 5px;

}


/* =========================
   INPUTS
========================= */

.editor input[type="text"] {

    width: 100%;

    box-sizing: border-box;

    background: #111;

    color: white;

    border: 1px solid #555;

    padding: 8px;

    margin-bottom: 12px;

    font-family: Arial, sans-serif;

    font-size: 14px;

}


.editor input[type="file"] {

    width: 100%;

    box-sizing: border-box;

    margin-bottom: 15px;

    color: white;

}


/* =========================
   CHANNEL PROGRAMMES
========================= */

.channel {

    background: #242424;

    border: 1px solid #3d3d3d;

    border-radius: 7px;

    padding: 12px;

    margin-bottom: 15px;

}


.channel h3 {

    margin:
        0 0 12px 0;

    font-size: 15px;

}


.channel label {

    display: block;

    margin-top: 10px;

    margin-bottom: 5px;

    font-size: 10px;

    color: #aaa;

}


.channel input[type="text"] {

    width: 100%;

    box-sizing: border-box;

    padding: 8px;

    background: #181818;

    border: 1px solid #444;

    color: white;

    border-radius: 4px;

    margin-bottom: 0;

}


/* =========================
   RESET BUTTON
========================= */

#resetButton {

    width: 100%;

    padding: 11px;

    background: #333;

    border: 1px solid #555;

    color: white;

    border-radius: 5px;

    cursor: pointer;

    font-size: 14px;

}


#resetButton:hover {

    background: #444;

}


/* =========================
   C4 PREVIEW
========================= */

.frame {

    width:
        min(
            100vw,
            calc(100vh * 16 / 9)
        );

    height:
        min(
            100vh,
            calc(100vw * 9 / 16)
        );

    aspect-ratio: 16 / 9;

    position: relative;

}


canvas {

    width: 100%;

    height: 100%;

    background: #fff;

    display: block;

}


/* =========================
   MOBILE LAYOUT
========================= */

@media (max-width: 700px) {

    html,
    body {

        display: block;

        width: 100%;

        height: auto;

        min-height: 100%;

        overflow-x: hidden;

        overflow-y: auto;

    }


    /* =====================
       PREVIEW FIRST
    ===================== */

    .frame {

        width: 100vw;

        height: auto;

        aspect-ratio: 16 / 9;

        margin: 0;

    }


    canvas {

        width: 100vw;

        height: auto;

        display: block;

    }


    /* =====================
       EDITOR UNDER PREVIEW
    ===================== */

    .editor {

        position: relative;

        top: auto;

        left: auto;

        width:
            calc(100% - 30px);

        max-height: none;

        margin:
            15px auto 30px auto;

        box-sizing: border-box;

        z-index: 10;

        border-radius: 8px;

    }

}


/* =========================
   SMALL PHONE
========================= */

@media (max-width: 400px) {

    .editor {

        width:
            calc(100% - 20px);

        padding: 14px;

        margin-top: 12px;

    }


    .editor h2 {

        font-size: 17px;

    }

}

</style>

</head>


<body>


<!-- =========================
     EDITOR
========================= -->

<div class="editor">


    <h2>
        C4 Channel Crossover — 2007
    </h2>


    <!-- =====================
         HEADING
    ====================== -->

    <label for="heading">

        Heading

    </label>


    <input
        type="text"
        id="heading"
        value="Now"
        oninput="draw()"
    >


    <!-- =====================
         RIGHT-HAND MEDIA
    ====================== -->

    <label for="mediaUpload">

        Right-Hand Image / Video

    </label>


    <input
        type="file"
        id="mediaUpload"
        accept="
            image/png,
            image/jpeg,
            image/webp,
            video/mp4,
            video/webm,
            video/ogg
        "
    >


    <!-- =====================
         CHANNEL 4
    ====================== -->

    <div class="channel">


        <h3>
            Channel 4
        </h3>


        <label for="programme0">

            Programme

        </label>


        <input
            type="text"
            id="programme0"
            value="Domestic Disturbance"
            oninput="draw()"
        >


    </div>


    <!-- =====================
         E4
    ====================== -->

    <div class="channel">


        <h3>
            E4
        </h3>


        <label for="programme1">

            Programme

        </label>


        <input
            type="text"
            id="programme1"
            value="Relocation, Relocation"
            oninput="draw()"
        >


    </div>


    <!-- =====================
         MORE4
    ====================== -->

    <div class="channel">


        <h3>
            More4
        </h3>


        <label for="programme2">

            Programme

        </label>


        <input
            type="text"
            id="programme2"
            value="Charlotte Gray"
            oninput="draw()"
        >


    </div>


    <!-- =====================
         FILM4
    ====================== -->

    <div class="channel">


        <h3>
            Film4
        </h3>


        <label for="programme3">

            Programme

        </label>


        <input
            type="text"
            id="programme3"
            value="Cutting Edge"
            oninput="draw()"
        >


    </div>


    <!-- =====================
         RESET
    ====================== -->

    <button
        id="resetButton">

        Reset

    </button>


</div>


<!-- =========================
     PREVIEW
========================= -->

<div class="frame">


    <canvas
        id="canvas"
        width="1920"
        height="1080">
    </canvas>


</div>


<script>


/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById(
        "canvas"
    );


const ctx =
    canvas.getContext("2d");


const W = 1920;

const H = 1080;


/* =========================
   OVERLAY
========================= */

const overlay =
    new Image();


overlay.src =
    "Overlay.png";


/* =========================
   RIGHT-HAND MEDIA
========================= */

let rightImage = null;

let rightVideo = null;

let rightObjectUrl = null;


/* =========================
   MEDIA UPLOAD
========================= */

document
    .getElementById("mediaUpload")
    .addEventListener(
        "change",
        function(event) {


            const file =
                event.target.files[0];


            if (!file) {

                return;

            }


            /* =================
               CLEAN OLD MEDIA
            ================= */

            if (rightObjectUrl) {

                URL.revokeObjectURL(
                    rightObjectUrl
                );

                rightObjectUrl = null;

            }


            rightImage = null;

            rightVideo = null;


            rightObjectUrl =
                URL.createObjectURL(
                    file
                );


            /* =================
               VIDEO
            ================= */

            if (
                file.type.startsWith(
                    "video/"
                )
            ) {


                const video =
                    document.createElement(
                        "video"
                    );


                video.src =
                    rightObjectUrl;


                video.muted =
                    true;


                video.loop =
                    true;


                video.playsInline =
                    true;


                video.autoplay =
                    true;


                video.addEventListener(
                    "loadeddata",
                    function() {


                        rightVideo =
                            video;


                        video
                            .play()
                            .catch(
                                () => {}
                            );


                        draw();

                    }
                );


                video.addEventListener(
                    "play",
                    renderVideoFrame
                );


            }


            /* =================
               IMAGE
            ================= */

            else {


                const image =
                    new Image();


                image.onload =
                    function() {


                        rightImage =
                            image;


                        draw();

                    };


                image.src =
                    rightObjectUrl;

            }

        }
    );


/* =========================
   VIDEO FRAME LOOP
========================= */

function renderVideoFrame() {


    if (rightVideo) {


        draw();


        requestAnimationFrame(
            renderVideoFrame
        );


    }

}


/* =========================
   TEXT WRAPPING
========================= */

function wrapText(
    text,
    maxCharacters
) {


    if (
        text.length <=
        maxCharacters
    ) {

        return [text];

    }


    const words =
        text.split(" ");


    const lines = [];


    let current = "";


    words.forEach(
        word => {


            if (
                current.length === 0 ||
                (
                    current +
                    " " +
                    word
                ).length <=
                maxCharacters
            ) {


                current =
                    current.length === 0
                        ? word
                        : current +
                          " " +
                          word;


            }


            else {


                lines.push(
                    current
                );


                current =
                    word;

            }

        }
    );


    if (current) {

        lines.push(
            current
        );

    }


    return lines.slice(
        0,
        2
    );

}


/* =========================
   DRAW
========================= */

function draw() {


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* =====================
       WHITE BACKGROUND
    ===================== */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* =====================
       RIGHT-HAND VIDEO
    ===================== */

    if (
        rightVideo &&
        rightVideo.readyState >= 2
    ) {


        ctx.drawImage(
            rightVideo,
            1260,
            0,
            660,
            1080
        );

    }


    /* =====================
       RIGHT-HAND IMAGE
    ===================== */

    else if (
        rightImage &&
        rightImage.complete &&
        rightImage.naturalWidth > 0
    ) {


        ctx.drawImage(
            rightImage,
            1260,
            0,
            660,
            1080
        );

    }


    /* =====================
       OVERLAY
    ===================== */

    if (
        overlay.complete &&
        overlay.naturalWidth > 0
    ) {


        ctx.drawImage(
            overlay,
            0,
            0,
            W,
            H
        );

    }


    /* =====================
       TEXT SETTINGS
    ===================== */

    ctx.textAlign =
        "left";


    ctx.textBaseline =
        "middle";


    /* =====================
       HEADING
       
       X = 430
       Y = 145
       SIZE = 100PX
    ===================== */

    const heading =
        document.getElementById(
            "heading"
        ).value;


    ctx.fillStyle =
        "#00768d";


    ctx.font =
        '100px "C4Headline"';


    ctx.fillText(
        heading,
        430,
        145
    );


    /* =====================
       PROGRAMME POSITIONS

       194PX APART
    ===================== */

    const programmeYPositions = [

        295,

        489,

        683,

        877

    ];


    /* =====================
       PROGRAMME COLOURS
    ===================== */

    const programmeColours = [

        "#67359b",

        "#55ad4a",

        "#b84d55",

        "#111111"

    ];


    /* =====================
       PROGRAMMES
    ===================== */

    for (
        let index = 0;
        index < 4;
        index++
    ) {


        const programme =
            document.getElementById(
                "programme" + index
            ).value;


        const rowY =
            programmeYPositions[
                index
            ];


        ctx.fillStyle =
            programmeColours[
                index
            ];


        /* =================
           FIXED 60PX SIZE
        ================= */

        ctx.font =
            '60px "C4Headline"';


        /* =================
           X POSITION
        ================= */

        const textX =
            435;


        /* =================
           WRAP
        ================= */

        const lines =
            wrapText(
                programme,
                28
            );


        /* =================
           ONE LINE
        ================= */

        if (
            lines.length === 1
        ) {


            ctx.fillText(
                lines[0],
                textX,
                rowY
            );


        }


        /* =================
           TWO LINES
        ================= */

        else {


            ctx.fillText(
                lines[0],
                textX,
                rowY - 30
            );


            ctx.fillText(
                lines[1],
                textX,
                rowY + 30
            );

        }

    }

}


/* =========================
   OVERLAY LOADING
========================= */

overlay.onload =
    function() {

        draw();

    };


/* =========================
   FONT LOADING
========================= */

async function loadFonts() {


    try {


        await document.fonts.load(
            '60px "C4Headline"'
        );


        await document.fonts.load(
            '100px "C4Headline"'
        );


    }


    catch (error) {


        console.error(
            "Font loading error:",
            error
        );

    }


    draw();

}


/* =========================
   RESET
========================= */

document
    .getElementById(
        "resetButton"
    )
    .addEventListener(
        "click",
        function() {

            location.reload();

        }
    );


/* =========================
   START
========================= */

loadFonts();

draw();


</script>

</body>
</html>
